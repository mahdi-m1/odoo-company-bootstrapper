[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-company-bootstrapper"
version = "1.2.0"
description = "إنشاء شركة في أودو — البحرين، نظام ساعات، واجهة ويب منفذ 80"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Odoo Company Bootstrapper"}]
keywords = ["odoo", "ai", "claude", "bahrain", "hourly"]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.9",
    "customtkinter>=5.2.0",
]

[project.scripts]
odoo-bootstrap = "odoo_bootstrapper.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["odoo_bootstrapper*"]
