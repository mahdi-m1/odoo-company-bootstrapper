[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-company-bootstrapper"
version = "1.0.0"
description = "برنامج ذكي لإنشاء هيكل شركة كامل داخل أودو تلقائياً باستخدام Claude CLI أو أي LLM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Odoo Company Bootstrapper"}
]
keywords = ["odoo", "ai", "claude", "bootstrap", "erp", "hr"]
dependencies = [
    "typer[all]>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff"]

[project.scripts]
odoo-bootstrap = "odoo_bootstrapper.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["odoo_bootstrapper*"]

[tool.setuptools.package-data]
odoo_bootstrapper = ["templates/*"]
